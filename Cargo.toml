[package]
name = "gcp-snap-crab"
version = "0.3.0"
edition = "2021"
authors = ["Mikolaj Rutecki", "Mikolaj Rutecki <ruteckimikolaj+crates.io@gmail.com>"]
description = "A minimalist, powerful, terminal-based GCP backup and restore tool written in Rust"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/ruteckimikolaj/gcp-snap-crab"
homepage = "https://github.com/ruteckimikolaj/gcp-snap-crab"
keywords = ["gcp", "backup", "restore", "terminal", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"
exclude = [
    ".github/*",
    "assets/*",
    "LICENSE",
    "README.md",
]

[dependencies]
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
async-trait = "0.1"
mockall = "0.14"
arboard = "3"

[profile.release]
debug = false
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get --assume-yes install libssl-dev:arm64 pkg-config libxcb1-dev:arm64 libxcb-render0-dev:arm64 libxcb-shape0-dev:arm64 libxcb-xfixes0-dev:arm64",
]

[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get --assume-yes install libssl-dev pkg-config libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev",
]

[badges]
maintenance = { status = "actively-developed" }
